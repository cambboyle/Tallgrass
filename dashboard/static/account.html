<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><h1>Account</h1><nav><a href="/">Party</a><a href="box.html">Boxes</a><a href="trainers.html">Trainers</a><a href="saves.html">Saves</a><a href="library.html">Library</a><a href="account.html" class="on">Account</a><a href="setup.html">Setup</a></nav></div>
  <div id="status"></div>
</header>
<div id="error"></div>
<main class="saves">
  <div id="account"></div>
  <section class="card" id="update-card">
    <h3 class="panel-title">Updates</h3>
    <div id="update-body"><p class="sub">Loading…</p></div>
  </section>
  <section class="card" id="pin-card">
    <h3 class="panel-title">Dashboard PIN</h3>
    <div id="pin-body"><p class="sub">Loading…</p></div>
  </section>
</main>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let timer = null;

function html(v) {
  if (v.linked && v.device) {
    const who = esc(v.device.account.displayName || "your account");
    return `<section class="card">
      <h3 class="panel-title">Linked</h3>
      <p>This device (<b>${esc(v.device.name)}</b>) is linked to <b>${who}</b>${v.device.account.isMaintainer ? ` <span class="pill ok">maintainer</span>` : ""}.</p>
      <p class="sub">Manage your devices at <a href="${esc(v.siteUrl)}/account">${esc(v.siteUrl.replace(/^https?:\/\//, ""))}/account</a>.</p>
      <p style="margin-top:12px"><button class="btn" id="unlink">Unlink this device</button></p>
    </section>
    <section class="card" id="sync-card">
      <h3 class="panel-title">Cloud backups</h3>
      <label class="toggle"><input type="checkbox" id="sync-on"> Back up my saves and Journey to my account</label>
      <p class="sub">Every save backup is copied to your account (the newest 30 versions of each save are kept) along with your Journey history. Download them at <a href="${esc(v.siteUrl)}/account">${esc(v.siteUrl.replace(/^https?:\/\//, ""))}/account</a>. Only you can see them.</p>
      <p class="sub" id="sync-status"></p>
    </section>`;
  }
  if (v.pairing) {
    const url = `${v.siteUrl}/link?code=${encodeURIComponent(v.pairing.code)}`;
    return `<section class="card">
      <h3 class="panel-title">Enter this code</h3>
      <p class="pair-code">${esc(v.pairing.code)}</p>
      <p>Go to <a href="${esc(url)}" target="_blank" rel="noopener">${esc(v.siteUrl.replace(/^https?:\/\//, ""))}/link</a>, sign in and enter the code.
      This page updates by itself when you're done.</p>
      <p class="sub">The code works until ${new Date(v.pairing.expiresAt).toLocaleTimeString([], { timeStyle: "short" })}.</p>
    </section>`;
  }
  return `<section class="card">
    <h3 class="panel-title">Tallgrass account</h3>
    <p>Link this device to your Tallgrass account. Nothing is uploaded unless you choose to, and the dashboard works the same either way.</p>
    <p style="margin-top:12px"><button class="btn primary" id="link">Link this device</button></p>
  </section>`;
}

async function load() {
  const res = await fetch("/api/cloud");
  if (!res.ok) {
    document.getElementById("error").textContent = await res.text();
    return;
  }
  const v = await res.json();
  document.getElementById("error").textContent = v.error || "";
  document.getElementById("status").textContent = v.linked ? "linked" : v.pairing ? "waiting for code" : "not linked";
  document.getElementById("account").innerHTML = html(v);
  if (v.linked) loadSync();
  clearTimeout(timer);
  if (v.pairing) timer = setTimeout(load, 3000);
}

document.addEventListener("click", async (e) => {
  const post = (path) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  if (e.target.id === "link") {
    e.target.disabled = true;
    const res = await post("/api/cloud/link");
    if (!res.ok) document.getElementById("error").textContent = await res.text();
    load();
  }
  if (e.target.id === "unlink") {
    if (e.target.dataset.sure !== "1") { e.target.dataset.sure = "1"; e.target.textContent = "Click again to unlink"; return; }
    await post("/api/cloud/unlink");
    load();
  }
});
load();

// Cloud backups: on/off and the last sync.
async function loadSync() {
  const res = await fetch("/api/cloud/sync");
  const card = document.getElementById("sync-card");
  if (!card) return;
  if (!res.ok) { card.hidden = true; return; }
  const v = await res.json();
  document.getElementById("sync-on").checked = v.enabled;
  const when = v.lastAt ? new Date(v.lastAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
  document.getElementById("sync-status").textContent = !v.enabled ? "Off." :
    v.error ? `Last attempt failed: ${v.error}` :
    when ? `On. Last synced ${when}; ${v.sent} save version${v.sent === 1 ? "" : "s"} uploaded so far. Checks every 10 minutes.` :
    "On. The first upload starts in a moment.";
}
document.addEventListener("change", async (e) => {
  if (e.target.id !== "sync-on") return;
  await fetch("/api/cloud/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: e.target.checked }) });
  loadSync();
  setTimeout(loadSync, 5000);
});

// Dashboard PIN: set, change or remove it, and sign out.
async function loadPIN() {
  const st = await (await fetch("/api/auth/status")).json();
  const body = document.getElementById("pin-body");
  if (!st.enabled) { body.innerHTML = `<p class="sub">PIN protection is off for this Tallgrass.</p>`; return; }
  body.innerHTML = st.pinSet ? `
    <p>Anyone on your network needs the PIN to use this dashboard.</p>
    <form class="pin-form" id="pin-form">
      <label>Current PIN <input id="pin-current" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required></label>
      <label>New PIN <input id="pin-new" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12" placeholder="leave empty to remove"></label>
      <div class="row"><button class="btn primary" type="submit">Save</button> <button class="btn" type="button" id="signout">Sign out</button></div>
    </form>` : `
    <p>Right now anyone on your network can use this dashboard, including restoring saves. Set a PIN (4 to 12 digits) to lock it.</p>
    <form class="pin-form" id="pin-form">
      <label>New PIN <input id="pin-new" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12" required></label>
      <label>Again <input id="pin-again" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12" required></label>
      <div class="row"><button class="btn primary" type="submit">Set PIN</button></div>
    </form>`;
  body.insertAdjacentHTML("beforeend", `<p class="sub" id="pin-msg" role="alert"></p>`);
}
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "pin-form") return;
  e.preventDefault();
  const v = (id) => document.getElementById(id)?.value ?? "";
  const msg = document.getElementById("pin-msg");
  if (document.getElementById("pin-again") && v("pin-new") !== v("pin-again")) { msg.textContent = "The two PINs don't match."; return; }
  const res = await fetch("/api/auth/pin", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: v("pin-new"), current: v("pin-current") }) });
  if (!res.ok) { msg.textContent = await res.text(); return; }
  await loadPIN();
  document.getElementById("pin-msg").textContent = v("pin-new") ? "Saved. Other browsers will need the new PIN." : "PIN saved.";
});
document.addEventListener("click", async (e) => {
  if (e.target.id !== "signout") return;
  await fetch("/api/auth/logout", { method: "POST" });
  location.href = "/login.html";
});
loadPIN();

// Updates: show the version, check GitHub, install a newer release.
async function loadUpdate(check) {
  const res = await fetch("/api/update" + (check ? "?check=1" : ""));
  const body = document.getElementById("update-body");
  if (!res.ok) { body.innerHTML = `<p class="sub">Updates are off for this Tallgrass.</p>`; return; }
  const u = await res.json();
  const checked = u.checkedAt && !u.checkedAt.startsWith("0001") ? ` · checked ${new Date(u.checkedAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}` : "";
  let html = `<p>This is Tallgrass <b>${esc(u.current)}</b>${u.current === "dev" ? " (a development build, which doesn't update itself)" : ""}.<span class="sub">${checked}</span></p>`;
  if (u.available) {
    html += `<p><b>Tallgrass ${esc(u.latest)} is available.</b> <a href="${esc(u.url)}" target="_blank" rel="noopener">What's new</a></p>
      <p><button class="btn primary" id="update-apply">Install ${esc(u.latest)}</button></p>
      <p class="sub">Tallgrass restarts in a few seconds; games keep running.</p>`;
  } else if (u.error) {
    html += `<p class="sub">Couldn't check for updates: ${esc(u.error)}</p>`;
  } else if (u.latest) {
    html += `<p class="sub">You're on the latest release.</p>`;
  }
  html += `<p><button class="btn" id="update-check">Check now</button></p><p class="sub" id="update-msg" role="alert"></p>`;
  body.innerHTML = html;
}
document.addEventListener("click", async (e) => {
  if (e.target.id === "update-check") { e.target.disabled = true; loadUpdate(true); }
  if (e.target.id === "update-apply") {
    e.target.disabled = true;
    e.target.textContent = "Installing…";
    const res = await fetch("/api/update/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (!res.ok) { document.getElementById("update-msg").textContent = await res.text(); e.target.disabled = false; return; }
    document.getElementById("update-msg").textContent = "Installed. Restarting…";
    setTimeout(() => location.reload(), 8000);
  }
});
loadUpdate(false);
</script>
</body>
</html>
