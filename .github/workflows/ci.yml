name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile for the Pi
        run: GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null .

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public values (the same ones the browser gets).
      NEXT_PUBLIC_SUPABASE_URL: https://ifjlueqhuyaafjuzltoi.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmamx1ZXFodXlhYWZqdXpsdG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NzY5ODksImV4cCI6MjEwNzE1Mjk4OX0.6Njg2t9WD5F9ttBNU1aQye6smZN2nwufkSFsYyfVUUQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
